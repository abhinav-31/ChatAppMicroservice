# Application Name
spring.application.name=USER-SETTING-SERVICE

# Server Port
server.port=${USER_SETTING_PORT}

# eureka client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${DEFAULT_ZONE}
eureka.instance.hostname=${HOST_NAME}

# Database properties
spring.datasource.url=${USER_SETTING_DB_URL}
spring.datasource.username=${USER_SETTING_DB_USER}
spring.datasource.password=${USER_SETTING_DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA properties
spring.datasource.platform=mysql
spring.datasource.initialization-mode=always
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Dev Tools
spring.devtools.livereload.enabled=true

# Twilio Configuration
twilio.account-sid=${T_SID}
twilio.auth-token=${T_TOKEN}
twilio.phone-number=${T_PHONE-NUMBER}

# Redis Configuration
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}
spring.cache.type=${REDIS_CACHE_TYPE}

# For Console Logs Colors
spring.output.ansi.enabled=ALWAYS

# JWT CONFIG
jwt.SECRET_KEY=${JWT_SECRET_KEY}
jwt.EXPIRATIONTIME.ACCESSTOKEN=${JWT_ACCESS_TOKEN_TIME}
jwt.EXPIRATIONTIME.REFRESHTOKEN=${JWT_REFRESH_TOKEN_TIME}


# actuator
management.endpoint.health.access=UNRESTRICTED
management.endpoints.web.exposure.include=health,info